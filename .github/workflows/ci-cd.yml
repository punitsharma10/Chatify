# Chatify CI/CD
#  - every push / pull request: backend tests + frontend production build
#  - push to main, and only if everything passes: deploy backend (Render web service) and frontend (Render static site)
# Setup steps: see DEPLOYMENT.md

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo: # throwaway database for the tests
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Every file parses and loads
        run: npm run check
      - name: End-to-end API, OTP and phone tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/chatify_test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Production build (lint warnings fail the build)
        run: npm run build
        env:
          CI: true
          REACT_APP_BACKEND_URL: https://example.invalid

  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set - skipping backend deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy started"

      - name: Deploy frontend to Render (static site)
        env:
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_FRONTEND_DEPLOY_HOOK_URL secret not set - skipping frontend deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL" > /dev/null
          echo "Render static site deploy started"
