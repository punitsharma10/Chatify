<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chatify</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; color: #111b21; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    .logo { width: 88px; height: 88px; border-radius: 22px; background: #00a884; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #667781; font-size: 14px; line-height: 20px; max-width: 280px; }
    button { border: 0; border-radius: 999px; background: #008069; color: #fff; font-size: 14px; font-weight: 500; padding: 10px 28px; }
    @media (prefers-color-scheme: dark) { html, body { background: #111b21; color: #e9edef; } p { color: #8696a0; } }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg width="52" height="52" viewBox="0 0 512 512"><path fill="#fff" d="M 106 236 a 150 150 0 1 1 93 135 L 98.5 408.5 L 133 323 A 150 150 0 0 1 106 236 Z"/><circle cx="201" cy="236" r="17" fill="#00a884"/><circle cx="256" cy="236" r="17" fill="#00a884"/><circle cx="311" cy="236" r="17" fill="#00a884"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Chatify couldn't connect. Check your internet connection and try again. The first open after a while can take up to a minute.</p>
    <button onclick="location.replace('https://chatifybypunit.onrender.com')">Try again</button>
  </main>
</body>
</html>
